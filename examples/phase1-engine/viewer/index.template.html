<title>3D Claude Hub Remote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="aaw-ws" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed 3D office, a glass top bar, and a right-hand side panel that becomes a bottom sheet on phones.
     Tokens follow §7.1 of the prompt. The app is dark only by design (blue-hour glass office). */
  :root {
    --ink-950: #06080c; --ink-900: #0a0e14; --ink-850: #0e131b; --ink-800: #121823; --ink-700: #1a2230; --ink-600: #263041;
    --mist-100: #eef2f7; --mist-300: #b7c1cf; --mist-500: #7c8797;
    --signal: #7cc4d6; --signal-strong: #9ad7e6; --ok: #6fe3a4; --warn: #f2b46a; --bad: #ff8a7a;
    --glass: color-mix(in oklab, var(--ink-850) 78%, transparent);
    --hair: color-mix(in oklab, var(--mist-100) 9%, transparent);
    --font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--ink-950); color: var(--mist-100); font-family: var(--font-ui); font-size: 13px; overflow: hidden; }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; }

  .app { position: relative; height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 372px; grid-template-rows: auto minmax(0, 1fr); }
  #stage { position: absolute; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .surface {
    background: linear-gradient(180deg, color-mix(in oklab, var(--ink-800) 82%, transparent), var(--glass));
    border: 1px solid var(--hair);
    box-shadow: inset 0 1px 0 color-mix(in oklab, var(--mist-100) 6%, transparent), 0 18px 40px -18px #000;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 14px;
  }
  .eyebrow { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--mist-500); font-weight: 600; }

  /* Top bar */
  .top { grid-column: 1 / -1; position: relative; z-index: 2; padding-top: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
  .bar { pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 14px; }
  .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
  .brand p { margin: 0; font-size: 11.5px; color: var(--warn); }
  .brand p.live { color: var(--ok); }
  .brand p.down { color: var(--bad); }
  .metrics { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
  .metric { display: flex; flex-direction: column; gap: 1px; }
  .metric b { font-size: 15px; font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--mist-300); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mist-500); }
  .dot.running { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 1.6s infinite; }
  .dot.paused { background: var(--warn); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
  .controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .btn { border: 1px solid var(--hair); background: color-mix(in oklab, var(--ink-700) 70%, transparent); border-radius: 9px; padding: 6px 11px; cursor: pointer; font-weight: 500; }
  .btn:hover { border-color: color-mix(in oklab, var(--signal) 45%, transparent); }
  .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--signal-strong); outline-offset: 2px; }
  .btn.primary { background: var(--signal); color: var(--ink-950); border-color: transparent; font-weight: 600; }
  .btn.primary:hover { background: var(--signal-strong); }
  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 6px 9px; cursor: pointer; font-variant-numeric: tabular-nums; color: var(--mist-300); }
  .seg button[aria-pressed="true"] { background: var(--ink-600); color: var(--mist-100); }

  /* Side panel */
  .side { grid-column: 2; grid-row: 2; position: relative; z-index: 2; padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px 0; min-height: 0; }
  .panel { height: 100%; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel section { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .panel section + section { border-top: 1px solid var(--hair); }
  .panel .grow { flex: 1; }
  .scroll { overflow: auto; min-height: 0; scrollbar-width: thin; }
  .agent-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--ink-950); grid-row: span 2; }
  .agent-card .now { grid-column: 1 / -1; color: var(--mist-300); font-size: 12px; }
  .roster { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 4px; border-radius: 999px; border: 1px solid var(--hair); background: transparent; cursor: pointer; font-size: 12px; color: var(--mist-300); }
  .chip i { width: 14px; height: 14px; border-radius: 50%; }
  .chip[aria-pressed="true"] { border-color: var(--mist-300); color: var(--mist-100); }
  .chip small { color: var(--mist-500); font-size: 11px; }

  .tasks { display: flex; flex-direction: column; gap: 8px; }
  .task { border: 1px solid var(--hair); border-radius: 10px; padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; background: color-mix(in oklab, var(--ink-800) 60%, transparent); }
  .task header { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--mist-500); font-family: var(--font-mono); }
  .task h3 { margin: 0; font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .tag { font-family: var(--font-ui); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--hair); color: var(--mist-300); }
  .tag.critical { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 40%, transparent); }
  .tag.high { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 40%, transparent); }
  .tag.done { color: var(--ok); border-color: color-mix(in oklab, var(--ok) 40%, transparent); }
  .tag.failed, .tag.blocked { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 40%, transparent); }
  .bar-track { height: 4px; border-radius: 3px; background: var(--ink-600); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width .3s ease; }
  .task footer { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--mist-300); }
  .task footer .rework { color: var(--warn); }
  .empty { color: var(--mist-500); font-size: 12px; line-height: 1.5; }

  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .feed li { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 8px; font-size: 12px; line-height: 1.4; color: var(--mist-300); }
  .feed time { font-family: var(--font-mono); font-size: 11px; color: var(--mist-500); font-variant-numeric: tabular-nums; }
  .feed li.success span { color: var(--ok); }
  .feed li.warning span { color: var(--warn); }
  .feed li.error span { color: var(--bad); }
  .feed b { font-weight: 600; }

  /* Speech bubbles: DOM, positioned from projected anchors each frame (§6.4) */
  #bubbles { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .bubble { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; display: flex; align-items: center; gap: 7px; padding: 5px 10px 5px 8px; border-radius: 999px; background: color-mix(in oklab, var(--ink-900) 86%, transparent); border: 1px solid var(--hair); font-size: 12px; white-space: nowrap; max-width: 300px; visibility: hidden; }
  .bubble i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .bubble b { font-weight: 600; }
  .bubble span { color: var(--mist-300); overflow: hidden; text-overflow: ellipsis; }
  .bubble.success { border-color: color-mix(in oklab, var(--ok) 60%, transparent); }
  .bubble.error { border-color: color-mix(in oklab, var(--warn) 70%, transparent); }

  .hint { position: absolute; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 11.5px; color: var(--mist-500); padding: 6px 10px; }
  .loading { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: var(--ink-950); color: var(--mist-300); }
  .error-box { max-width: 420px; padding: 18px; line-height: 1.5; }

  @media (max-width: 820px) {
    body { overflow: hidden; }
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) 42dvh; }
    .side { grid-column: 1; grid-row: 3; padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
    .controls { margin-left: 0; }
    .hint { display: none; }
    .metrics { gap: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .dot.running { animation: none; } .bar-fill { transition: none; } }
</style>

<div class="app">
  <div id="stage" aria-label="3D office: six robot agents working through tasks"></div>
  <div id="bubbles" aria-hidden="true"></div>

  <div class="top">
    <div class="bar surface">
      <div class="brand">
        <h1>3D Claude Hub Remote</h1>
        <p id="mode-line">Simulation mode · no live inference</p>
      </div>
      <div class="metrics" aria-live="polite">
        <div class="metric"><span class="eyebrow">Active</span><b id="m-active">0</b></div>
        <div class="metric"><span class="eyebrow">Pending</span><b id="m-pending">0</b></div>
        <div class="metric"><span class="eyebrow">Done</span><b id="m-done">0</b></div>
        <div class="metric"><span class="eyebrow">Clock</span><b id="m-clock">0.0s</b></div>
      </div>
      <span class="status"><span class="dot" id="status-dot"></span><span id="status-label">Ready</span></span>
      <div class="controls">
        <button class="btn" id="btn-toggle" type="button">Pause</button>
        <div class="seg" role="group" aria-label="Simulation speed" id="speed">
          <button type="button" data-speed="0.5">0.5×</button><button type="button" data-speed="1">1×</button><button type="button" data-speed="2">2×</button><button type="button" data-speed="4">4×</button>
        </div>
        <button class="btn" id="btn-sound" type="button" aria-pressed="true" title="Sound (M)">Sound on</button>
        <button class="btn" id="btn-notify" type="button" hidden>Notify me</button>
        <button class="btn" id="btn-reset" type="button">Reset</button>
        <button class="btn" id="btn-sprint" type="button">Load sprint</button>
        <button class="btn primary" id="btn-demo" type="button">Run demo</button>
      </div>
    </div>
  </div>

  <aside class="side">
    <div class="panel surface">
      <section>
        <span class="eyebrow" id="agent-heading">Team · click a robot to follow it</span>
        <div id="agent-detail" hidden></div>
        <div class="roster" id="roster"></div>
      </section>
      <section class="scroll" style="max-height: 46%;">
        <span class="eyebrow" id="tasks-heading">Tasks</span>
        <div class="tasks" id="tasks"></div>
      </section>
      <section class="grow scroll">
        <span class="eyebrow">Activity</span>
        <ol class="feed" id="feed"></ol>
      </section>
    </div>
  </aside>

  <div class="hint surface">Drag to orbit · scroll to zoom · click a robot to follow · Esc to release</div>
  <div class="loading" id="loading"><span>Building the office…</span></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const { MockAgentBackend, WebSocketAgentBackend, SoundEngine, AGENTS, getAgent, STATION_OWNERS, LOCATIONS, HUB_CENTER, MISSION_CONTROL, CORRIDOR_Z, isCommunication, isTerminal, shortTitle, DEMO_TASK, SPRINT_TASKS } = window.AAW;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const PHASE_LABEL = { queued: "Waiting for Orion", intake: "Intake", planning: "Planning", research: "Research", implementation: "Implementation", testing: "Testing", review: "Code review", done: "Done", failed: "Failed" };

// ─────────────────────── backend: the same contract a real orchestrator would implement ───────────────────────
// Local simulation by default. ?ws=ws://host:port (or being served by the world server) switches to WebSocket.
const params = new URLSearchParams(location.search);
const wsMeta = document.querySelector('meta[name="aaw-ws"]')?.content;
const wsUrl = params.get("ws") || (wsMeta === "same-origin" ? `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/` : null);
// The token comes after # (never sent to a server or tunnel), or as ?token= from older links.
const viewerToken = new URLSearchParams(location.hash.replace(/^#/, "")).get("token") || params.get("token");
const backend = wsUrl ? new WebSocketAgentBackend({ url: wsUrl, ...(viewerToken ? { token: viewerToken } : {}) }) : new MockAgentBackend();
let connection = { state: wsUrl ? "connecting" : "open", error: null };
backend.subscribeConnection?.((c) => { connection = c; uiDirty = true; });
let snap = null;            // latest snapshot (the "liveWorld" buffer: read every frame, never triggers DOM work)
const log = [];             // event log for the feed
let uiDirty = true;
backend.subscribeSnapshot((s) => { snap = s; sound?.setRunning(s.status === "running"); });
backend.subscribe((e) => {
  log.push(e);
  if (log.length > 300) log.shift();
  if (e.type !== "agent.arrived" || e.feed) uiDirty = true;
  attention(e);
  // History replayed on connect stays silent; only news makes a sound.
  if (sound && Date.now() - e.timestamp < 15000) sound.play(e);
});
let sound = null;           // created once we know whether this is the simulation or a live mirror

// ─────────────────────── "Claude needs you": tab title + optional desktop notification (live only) ───────────────────────
const BASE_TITLE = document.title;
let notifyOn = false;
try { notifyOn = localStorage.getItem("aaw.notify") === "1" && "Notification" in window && Notification.permission === "granted"; } catch {}
function attentionOf(e) {
  if (e.agentId === "orion" && e.severity === "warning" && e.message.startsWith("Needs your permission")) return { badge: "⏳ Permission needed", body: e.message };
  if (e.agentId === "orion" && e.severity === "warning" && e.message.startsWith("Claude Code needs you")) return { badge: "⏳ Needs you", body: e.message };
  if (e.type === "task.completed") return { badge: "✓ Turn ended", body: e.message };
  if (e.type === "task.failed") return { badge: "✗ Stopped", body: e.message };
  return null;
}
function attention(e) {
  if (backend.simulated) return;
  // Events replayed on connect are history, not news.
  if (Date.now() - e.timestamp > 15000) return;
  const a = attentionOf(e);
  if (!a) {
    // Claude is working again: whatever it was waiting for is over.
    if (e.feed && document.title !== BASE_TITLE && e.type !== "system.stopped") document.title = BASE_TITLE;
    return;
  }
  document.title = `${a.badge} · ${BASE_TITLE}`;
  if (notifyOn && document.hidden) {
    try { new Notification(a.badge.replace(/^\S+\s/, ""), { body: a.body, tag: "aaw" }); } catch {}
  }
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && document.title.startsWith("✓")) document.title = BASE_TITLE;
});
function renderNotifyButton() {
  const b = $("btn-notify");
  b.hidden = backend.simulated || !("Notification" in window);
  if (b.hidden) return;
  const denied = Notification.permission === "denied";
  b.textContent = denied ? "Notifications blocked" : notifyOn ? "Notifications on" : "Notify me";
  b.disabled = denied;
  b.setAttribute("aria-pressed", String(notifyOn));
}

// ─────────────────────── renderer, scene, camera ───────────────────────
const stage = $("stage");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
} catch (err) {
  $("loading").innerHTML = '<div class="error-box surface">WebGL is not available in this browser, so the 3D office cannot be drawn. The engine still runs: try <code>npm run demo -- --live</code> in a terminal.</div>';
  throw err;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#080b10");
scene.fog = new THREE.Fog("#0a0e15", 48, 130);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 220);
camera.position.set(-1.2, 20, 25);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-1.2, 0, 0.8);
controls.enableDamping = true;
controls.minDistance = 3.5;
controls.maxDistance = 70;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = 1.36;

// Fit by free area (§6.6): the floating top bar and side panel report their rects; the projection is shifted and
// widened so the office centres in the space they leave uncovered instead of hiding behind them.
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const bar = document.querySelector(".bar").getBoundingClientRect();
  const panel = document.querySelector(".panel").getBoundingClientRect();
  const sideBySide = panel.top < h * 0.5;
  const left = 0, right = sideBySide ? panel.left : w;
  const top = bar.bottom, bottom = sideBySide ? h : panel.top;
  const freeW = Math.max(120, right - left), freeH = Math.max(120, bottom - top);
  const base = freeW / freeH < 1 ? 58 : freeW / freeH < 1.4 ? 48 : 40;
  camera.fov = Math.min(80, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(base) / 2) * h / freeH)));
  camera.setViewOffset(w, h, w / 2 - (left + right) / 2, h / 2 - (top + bottom) / 2, w, h);
  camera.updateProjectionMatrix();
}
const ro = new ResizeObserver(resize);
ro.observe(stage); ro.observe(document.querySelector(".bar")); ro.observe(document.querySelector(".panel"));
resize();

// ─────────────────────── procedural textures (no binary assets) ───────────────────────
function canvasTex(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return Object.assign(t, { canvas: c });
}
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = "#1c2230"; g.fillRect(0, 0, w, h);
  const n = 8, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = 30 + ((i * 7 + j * 13) % 6) * 2;
    g.fillStyle = `rgb(${v},${v + 4},${v + 12})`; g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
  }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(3.75, 2.6);
const skyTex = canvasTex(16, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, "#0b1530"); gr.addColorStop(.55, "#253a6b"); gr.addColorStop(.85, "#b06a5a"); gr.addColorStop(1, "#e7a46a");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const windowsTex = canvasTex(64, 128, (g, w, h) => {
  g.fillStyle = "#05070b"; g.fillRect(0, 0, w, h);
  for (let y = 4; y < h; y += 8) for (let x = 4; x < w; x += 8) {
    const r = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453 % 1;
    if (Math.abs(r) > .62) { g.fillStyle = Math.abs(r) > .9 ? "#ffd9a0" : "#8fb7ff"; g.fillRect(x, y, 4, 4); }
  }
});
const codeTex = canvasTex(256, 160, (g, w, h) => {
  g.fillStyle = "#0b1220"; g.fillRect(0, 0, w, h);
  const cols = ["#7cc4d6", "#a78bfa", "#6fe3a4", "#b7c1cf", "#f2b46a"];
  for (let y = 10, i = 0; y < h; y += 11, i++) {
    let x = 10 + (i % 4) * 12;
    while (x < w - 20) { const len = 10 + ((i * 31 + x) % 46); g.fillStyle = cols[(i + x) % cols.length]; g.globalAlpha = .85; g.fillRect(x, y, len, 4); x += len + 8; }
  }
  g.globalAlpha = 1;
});
codeTex.wrapT = THREE.RepeatWrapping;
const blobTex = canvasTex(64, 64, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, "rgba(0,0,0,.55)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});

// ─────────────────────── lights ───────────────────────
scene.add(new THREE.HemisphereLight("#a9bfef", "#2a2018", 1.6));
const sun = new THREE.DirectionalLight("#ffe0c0", 1.6);
sun.position.set(-8, 18, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 3; sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 13, bottom: -13, near: 1, far: 50 });

      const r = robots.get(a.id);
      const target = tmp.set(a.position.x, 0, a.position.z);
      if (!r.init || r.shown.distanceTo(target) > 4) { r.shown.copy(target); r.heading = a.heading; r.init = true; }
      const before = r.shown.clone();
      r.shown.x = damp(r.shown.x, target.x, 12, dt); r.shown.z = damp(r.shown.z, target.z, 12, dt);
      r.heading = angleDamp(r.heading, a.heading, 9, dt);
      r.root.position.copy(r.shown); r.root.rotation.y = r.heading;
      const speed = before.distanceTo(r.shown) / Math.max(dt, 1e-3);

      // Procedural pose per status; frozen-ish when paused or the sim is not running
      const k = (a.paused || !running ? .15 : 1) * (reduceMotion ? .4 : 1);
      r.walkPhase += dt * k * (a.status === "walking" ? 9.5 * Math.min(1.2, speed / 2.4 + .3) : 0);
      const walk = a.status === "walking" ? 1 : 0, sw = Math.sin(r.walkPhase) * .55 * walk;
      r.legL.rotation.x = sw; r.legR.rotation.x = -sw;
      let armL = -sw * .8, armR = sw * .8, lean = 0, headTilt = 0, headTurn = 0, bob = Math.abs(Math.sin(r.walkPhase)) * .05 * walk;
      const tt = t * k;
      if (a.status === "working") { lean = .18; armL = -1.0 + Math.sin(tt * 14) * .12; armR = -1.0 + Math.sin(tt * 14 + 1.7) * .12; headTilt = .18; }
      if (a.status === "thinking") { armR = -1.9; headTilt = -.12; headTurn = Math.sin(tt * 1.3) * .25; }
      if (a.status === "communicating") { armR = -1.2 + Math.sin(tt * 6) * .35; armL = -.3; headTurn = Math.sin(tt * 2) * .1; }
      if (a.status === "success") { bob = Math.abs(Math.sin(tt * 9)) * .18; armL = armR = -2.6; }
      if (a.status === "error") { lean = .38; headTilt = .45; armL = armR = .15; }
      if (a.status === "idle") { bob = Math.sin(tt * 2) * .012; }
      r.torso.rotation.x = damp(r.torso.rotation.x, lean, 8, dt);
      r.armL.rotation.x = damp(r.armL.rotation.x, armL, 10, dt); r.armR.rotation.x = damp(r.armR.rotation.x, armR, 10, dt);
      r.head.rotation.x = damp(r.head.rotation.x, headTilt, 8, dt); r.head.rotation.y = damp(r.head.rotation.y, headTurn, 6, dt);
      r.rig.position.y = damp(r.rig.position.y, bob, 14, dt);

      const busy = ["working", "thinking", "communicating"].includes(a.status);
      r.ringMat.opacity = damp(r.ringMat.opacity, a.paused ? .1 : busy ? .75 : .22, 6, dt);
      r.accent.emissiveIntensity = a.paused ? .2 : busy ? 1.4 + Math.sin(t * 5) * .3 : .8;
      r.selMat.opacity = damp(r.selMat.opacity, selected === a.id ? .9 : hovered === a.id ? .45 : 0, 10, dt);
      if ((a.status === "success" || a.status === "error") && r.lastStatus !== a.status) { r.pulseT = 0; r.pulseMat.color.set(a.status === "success" ? "#6fe3a4" : "#f2b46a"); }
      r.lastStatus = a.status;
      r.pulseT += dt;
      const pt = Math.min(1, r.pulseT / 1.1);
      r.pulse.scale.setScalar(1 + pt * 1.6); r.pulseMat.opacity = (1 - pt) * .8;

      // Path trail
      const p = paths.get(a.id), pts = [r.shown, ...a.path.map((q) => new THREE.Vector3(q.x, 0, q.z))];
      const visible = a.path.length > 0;
      p.line.visible = p.dest.visible = visible;
      if (visible) {
        const arr = p.line.geometry.attributes.position.array;
        for (let i = 0; i < 8; i++) { const q = pts[Math.min(i, pts.length - 1)]; arr[i * 3] = q.x; arr[i * 3 + 1] = .04; arr[i * 3 + 2] = q.z; }
        p.line.geometry.attributes.position.needsUpdate = true; p.line.geometry.setDrawRange(0, Math.min(8, pts.length));
        p.line.geometry.computeBoundingSphere(); p.line.computeLineDistances();
        const last = pts[pts.length - 1]; p.dest.position.set(last.x, .03, last.z); p.dest.scale.setScalar(1 + Math.sin(t * 4) * .12);
      }

      // Speech bubble anchor
      const el = bubbleEls.get(a.id);
      const show = selected === a.id || hovered === a.id || a.paused || ["communicating", "success", "error"].includes(a.status);
      tmp.set(r.shown.x, 2.25 * SHAPE[r.profile.role].scale, r.shown.z).project(camera);
      const on = show && tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
      el.style.visibility = on ? "visible" : "hidden";
      if (on) {
        const W = stage.clientWidth, H = stage.clientHeight;
        const dist = camera.position.distanceTo(r.shown);
        const sc = THREE.MathUtils.clamp(6.5 / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * dist), .72, 1.05);
        el.style.transform = `translate(${(tmp.x * .5 + .5) * W}px, ${(-tmp.y * .5 + .5) * H}px) translate(-50%, -100%) scale(${sc})`;
        const text = a.paused ? "Paused" : a.activity;
        const span = el.lastChild; if (span.textContent !== text) span.textContent = text;
        el.className = "bubble" + (a.status === "success" ? " success" : a.status === "error" ? " error" : "");
      }
    }

    // Desk screens glow when their owner works; the hub ring pulses for Orion
    for (const d of desks) {
      const a = s.agents.find((x) => x.id === d.owner);
      const working = a && a.status === "working" && a.location && a.location !== "hub";
      d.mat.emissiveIntensity = damp(d.mat.emissiveIntensity, working ? 1.25 : .18, 4, dt);
    }
    codeTex.offset.y = (codeTex.offset.y + dt * .08) % 1;
    const orion = s.agents.find((x) => x.id === "orion");
    hubRingMat.opacity = ["thinking", "working", "communicating"].includes(orion.status) ? .55 + Math.sin(t * 5) * .35 : .3;

    // Links
    const alive = new Set();
    for (const l of s.links) {
      alive.add(l.id);
      const o = linkObj(l), a = robots.get(l.from).shown, b = robots.get(l.to).shown;
      const ha = 1.35, mid = new THREE.Vector3((a.x + b.x) / 2, ha + Math.min(4, a.distanceTo(b) * .28) + .4, (a.z + b.z) / 2);
      o.curve.v0.set(a.x, ha, a.z); o.curve.v1.copy(mid); o.curve.v2.set(b.x, ha, b.z);
      const arr = o.line.geometry.attributes.position.array;
      for (let i = 0; i <= 32; i++) { o.curve.getPoint(i / 32, tmp); arr[i * 3] = tmp.x; arr[i * 3 + 1] = tmp.y; arr[i * 3 + 2] = tmp.z; }
      o.line.geometry.attributes.position.needsUpdate = true; o.line.geometry.computeBoundingSphere();
      const life = (s.clock - l.startedAt) / (l.endsAt - l.startedAt);
      o.line.material.opacity = Math.max(0, Math.min(1, (1 - life) * 3)) * .9;
      o.packets.forEach((pk, i) => { o.curve.getPoint(((life * 1.6) + i / 3) % 1, pk.position); pk.visible = life < 1; });
    }
    for (const [id, o] of linkObjs) if (!alive.has(id)) { scene.remove(o.line, ...o.packets); o.line.geometry.dispose(); o.line.material.dispose(); o.packets.forEach((p) => p.material.dispose()); linkObjs.delete(id); }

    // Follow mode: keep the camera offset, move the target with the agent
    if (follow && selected) {
      const r = robots.get(selected).shown;
      const off = camera.position.clone().sub(controls.target);
      controls.target.x = damp(controls.target.x, r.x, 4, dt); controls.target.z = damp(controls.target.z, r.z, 4, dt); controls.target.y = damp(controls.target.y, .8, 4, dt);
      camera.position.copy(controls.target).add(off);
    }
  }
  if (s && t - lastBoards > .25) { lastBoards = t; drawMissionControl(s); drawPlanningBoard(s); }
  controls.update();
  renderer.render(scene, camera);
  if (!booted) { booted = true; $("loading").hidden = true; }  // the office is on screen
  requestAnimationFrame(frame);
}

// ─────────────────────── HTML UI (throttled, reads the snapshot) ───────────────────────
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("roster").innerHTML = AGENTS.map((a) => `<button class="chip" type="button" data-agent="${a.id}" aria-pressed="false"><i style="background:${a.color}"></i>${a.name} <small>${a.roleLabel}</small></button>`).join("");
$("roster").addEventListener("click", (e) => { const b = e.target.closest("[data-agent]"); if (b) select(selected === b.dataset.agent ? null : b.dataset.agent); });

let lastUi = 0, lastSig = "";
function renderUi(now) {
  requestAnimationFrame(renderUi);
  const s = snap; if (!s) return;
  if (now - lastUi < 160 && !uiDirty) return;
  lastUi = now;
  $("m-clock").textContent = s.clock.toFixed(1) + "s";
  const sig = JSON.stringify([s.status, s.speed, selected, s.agents.map((a) => [a.status, a.activity, a.paused, a.currentTaskId]), s.tasks.map((t) => [t.phase, t.status, Math.round(t.progress * 100), t.iteration, t.assignedAgentId]), log.length]);
  if (sig === lastSig && !uiDirty) return;
  lastSig = sig; uiDirty = false;

  const active = s.tasks.filter((t) => t.phase !== "queued" && !isTerminal(t.phase));
  $("m-active").textContent = active.length;
  $("m-pending").textContent = s.tasks.filter((t) => !isTerminal(t.phase)).length;
  $("m-done").textContent = s.tasks.filter((t) => t.phase === "done").length;
  const down = connection.state !== "open";
  $("status-dot").className = "dot " + (down ? "" : s.status);
  $("status-label").textContent = down ? (connection.state === "closed" ? "Disconnected" : "Reconnecting…") : { running: "Running", paused: "Paused", ready: "Ready" }[s.status];
  const modeLine = $("mode-line");
  modeLine.textContent = backend.simulated ? `Simulation mode · no live inference${wsUrl ? " · via server" : ""}` : `${backend.label} · read-only mirror`;
  modeLine.className = down ? "down" : backend.simulated ? "" : "live";
  if (down && connection.error) modeLine.textContent += ` · ${connection.error}`;
  for (const id of ["btn-demo", "btn-sprint", "speed"]) $(id).hidden = !backend.simulated;
  renderNotifyButton();
  renderSoundButton();
  if (sound) document.documentElement.dataset.soundPlayed = String(sound.played);
  $("btn-reset").textContent = backend.simulated ? "Reset" : "Clear";
  $("btn-toggle").textContent = s.status === "running" ? "Pause" : s.status === "paused" ? "Resume" : "Start";
  for (const b of $("speed").children) b.setAttribute("aria-pressed", String(+b.dataset.speed === s.speed));
  for (const b of $("roster").children) b.setAttribute("aria-pressed", String(b.dataset.agent === selected));

  const detail = $("agent-detail");
  if (selected) {
    const p = getAgent(selected), a = s.agents.find((x) => x.id === selected);
    const task = a.currentTaskId ? s.tasks.find((t) => t.id === a.currentTaskId) : null;
    detail.hidden = false;
    $("agent-heading").textContent = follow ? "Following · Esc to release" : "Selected";
    detail.innerHTML = `<div class="agent-card"><span class="avatar" style="background:${p.color}">${p.name[0]}</span><b>${p.name}</b><span style="color:var(--mist-500)">${p.roleLabel} · ${p.tagline}</span>
      <div class="now">${a.paused ? "Paused" : esc(a.activity)}${task ? ` · <span style="font-family:var(--font-mono)">${task.id}</span>` : ""}</div></div>`;
  } else { detail.hidden = true; $("agent-heading").textContent = "Team · click a robot to follow it"; }

  const order = (t) => (t.phase === "queued" ? 1 : isTerminal(t.phase) ? 2 : 0);
  const tasks = [...s.tasks].sort((a, b) => order(a) - order(b) || b.createdAt - a.createdAt || b.id.localeCompare(a.id));
  $("tasks-heading").textContent = `Tasks · ${active.length} active`;
  $("tasks").innerHTML = tasks.length ? tasks.map((t) => {
    const owner = t.assignedAgentId ? getAgent(t.assignedAgentId) : null;
    const color = t.phase === "done" ? "var(--ok)" : t.status === "blocked" ? "var(--warn)" : t.phase === "failed" ? "var(--bad)" : owner ? owner.color : "var(--mist-500)";
    const state = t.phase === "done" ? '<span class="tag done">done</span>' : t.phase === "failed" ? '<span class="tag failed">failed</span>' : t.status === "blocked" ? '<span class="tag blocked">blocked</span>' : "";
    return `<article class="task"><header>${t.id}${t.isDemo ? ' <span class="tag">demo</span>' : ""} <span class="tag ${t.priority}">${t.priority}</span> ${state}</header>
      <h3>${esc(t.title)}</h3><div class="bar-track"><div class="bar-fill" style="width:${(t.progress * 100).toFixed(1)}%;background:${color}"></div></div>
      <footer><span>${owner && !isTerminal(t.phase) ? `<b style="color:${owner.color}">${owner.name}</b> · ` : ""}${PHASE_LABEL[t.phase]}</span>${t.iteration > 1 ? `<span class="rework">reworked ${t.iteration - 1}×</span>` : ""}</footer></article>`;
  }).join("") : !backend.simulated ? '<p class="empty">Waiting for Claude Code. Type a prompt in a session that has the hooks enabled, or run <code>npm run replay</code> to play back a recorded session.</p>' : '<p class="empty">No tasks yet. <b>Run demo</b> sends one task through the whole team: Orion delegates, Piper plans, Iris researches, Kai builds, Quinn fails the first build, Kai fixes it, Rex approves. <b>Load sprint</b> queues 8 tasks.</p>';

  const items = log.filter((e) => e.feed && (!selected || e.agentId === selected || e.targetAgentId === selected)).slice(-40).reverse();
  $("feed").innerHTML = items.map((e) => {
    const from = e.agentId ? getAgent(e.agentId) : null, to = isCommunication(e) && e.targetAgentId ? getAgent(e.targetAgentId) : null;
    const name = (a) => `<b style="color:${a.color}">${a.name}</b>`;
    let html = esc(e.message);
    if (to) html = `${name(from)} → ${name(to)} ${html}`;
    else if (from && e.message.startsWith(from.name)) html = name(from) + esc(e.message.slice(from.name.length));
    else if (from) html = `${name(from)} · ${html}`;
    return `<li class="${e.severity}"><time>${e.simTime.toFixed(1)}s</time><span>${html}</span></li>`;
  }).join("");
}

// ─────────────────────── controls ───────────────────────
$("btn-toggle").addEventListener("click", () => { const st = snap?.status; st === "running" ? backend.pause() : st === "paused" ? backend.resume() : backend.start(); });
$("speed").addEventListener("click", (e) => { const b = e.target.closest("[data-speed]"); if (b) backend.setSpeed(+b.dataset.speed); });
$("btn-reset").addEventListener("click", async () => { await backend.reset(); log.length = 0; select(null); uiDirty = true; });
$("btn-demo").addEventListener("click", async () => { await backend.start(); await backend.submitTask(DEMO_TASK); });
$("btn-sprint").addEventListener("click", async () => {
  await backend.start();
  for (const [i, t] of SPRINT_TASKS.entries()) setTimeout(() => backend.submitTask(t), i * 220);
});

// Boot: connect; with the simulation, start and play the demo so the first view already shows the team at work.
try {
  await backend.connect();
} catch (err) {
  $("loading").innerHTML = `<div class="error-box surface">Could not connect to the world server at <code>${esc(wsUrl)}</code>: ${esc(err.message)}.</div>`;
  throw err;
}
snap = snap ?? backend.getSnapshot();
sound = new SoundEngine(backend.simulated ? "simulation" : "live");
sound.setRunning(snap?.status === "running");
if (params.has("autounlock")) sound.unlock(); // automated checks only (needs a browser launched with autoplay allowed)
if (backend.simulated) {
  await backend.start();
  if (!snap || snap.tasks.length === 0) await backend.submitTask(DEMO_TASK);
}
requestAnimationFrame(frame);
requestAnimationFrame(renderUi);

</script>
